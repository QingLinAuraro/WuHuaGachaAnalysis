adb:
  path: adb
  screenshot_dir: screenshots
  serial: auto
  search_paths:
    - "%ProgramFiles%/Netease/MuMu/nx_device/*/shell/adb.exe"
    - "%ProgramFiles%/Netease/MuMu Player 12/shell/adb.exe"
    - "%ProgramFiles%/ldplayer9/adb.exe"
    - "%ProgramFiles%/BlueStacks_nxt/HD-Adb.exe"
automation:
  image_recognition:
    action_interval: 0.5
    color_tolerance: 10
    max_retries: 3
    min_height: 360
    min_width: 640
    navigation_timeout: 30
    template_threshold: 0.8
# database.path 不在这里写：写相对路径会按启动时的 CWD 解析，换个启动方式就换了库。
# 默认由 src/config.py 的 database_path 给出绝对路径（<数据目录>/data/gacha.db）。
gacha:
  scan_page_delay: 2.0
  # 自动切换渠道（卡池）：扫完当前渠道后，展开记录页右上角的渠道面板，
  # 切到下一个尚未扫描的渠道继续扫，直到全部渠道扫完。
  # 关闭后只扫描进入记录页时所在的渠道。
  auto_switch_channel: true
  # 点击展开按钮后，等待渠道面板弹出动画完成的时间（秒）
  channel_panel_delay: 1.0
  # 单个渠道最多扫描多少页（防止异常时无限翻页）
  max_pages_per_channel: 500
gui:
  last_account_id: 1
  window_height: 600
  window_width: 900
